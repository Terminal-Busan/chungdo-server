# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - chungdo-server-dev

on:
  workflow_dispatch:

concurrency:
  group: chungdo-server-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install, build, and test
        run: |
          npm ci
          rm -f tsconfig.build.tsbuildinfo
          npm run build
          npm test
          npm run test:e2e

      - name: Package API
        run: |
          npm prune --omit=dev
          npm pkg set 'scripts.start=node dist/main.js'
          zip -qry node-app.zip dist package.json node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34D5A06E05784381BFEC263E471833EC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44C026D7B86D4CB297DD8680ECD0D0D8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CD976AD694274B32AD710444E005CC97 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chungdo-server-dev'
          slot-name: 'Production'
          package: node-app.zip

      - name: Verify deployment and report URL
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          test -n "$APP_URL"
          printf '%s\n' "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 "${APP_URL%/}/health/ready" | jq -e '.status == "ok"'
