# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Test and deploy FastAPI app to Azure Web App - chungdo-server-dev

on:
  workflow_dispatch:

concurrency:
  group: chungdo-server-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welfare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/welfare_test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -c "from copilot import CopilotClient"
          python -m pytest tests -q

      - name: Package API source
        run: zip -qr python-app.zip main.py mcp_server.py requirements.txt welfare -x "*/__pycache__/*" "*.pyc"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34D5A06E05784381BFEC263E471833EC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44C026D7B86D4CB297DD8680ECD0D0D8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CD976AD694274B32AD710444E005CC97 }}

      - name: Configure Python runtime and source build
        shell: bash
        run: |
          set -euo pipefail
          resource_group=$(az webapp list --query "[?name=='chungdo-server-dev'].resourceGroup | [0]" --output tsv)
          test -n "$resource_group"
          test "$resource_group" != "None"
          az webapp config set --resource-group "$resource_group" --name chungdo-server-dev --linux-fx-version 'PYTHON|3.14' --startup-file 'python -m uvicorn main:app --host 0.0.0.0 --port 8000' --output none
          az webapp config appsettings delete --resource-group "$resource_group" --name chungdo-server-dev --setting-names WEBSITE_RUN_FROM_PACKAGE --output none
          az webapp config appsettings set --resource-group "$resource_group" --name chungdo-server-dev --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true --output none

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chungdo-server-dev'
          slot-name: 'Production'
          package: python-app.zip

      - name: Verify deployment and report URL
        shell: bash
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          printf '%s\n' "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 --output openapi.json "${APP_URL%/}/openapi.json"
          jq -e '.info.title == "Welfare Next API"' openapi.json
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 --output health.json "${APP_URL%/}/api/health"
          jq -e '.data.status == "ok"' health.json
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 --output readiness.json "${APP_URL%/}/health/ready"
          jq -e '.status == "ok"' readiness.json
